name: Release

on:
  push:
    tags:
      - "v*"
      # Obsidian installs from the release whose tag equals manifest.json "version"
      # exactly (no "v"), so the bare form is the canonical tag.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check tag matches manifest.json and package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$version manifest=$manifest_version package=$package_version"
          if [ "$version" != "$manifest_version" ] || [ "$version" != "$package_version" ]; then
            echo "::error::Tag $TAG does not match manifest.json ($manifest_version) and package.json ($package_version)"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Obsidian looks for the release tagged exactly like manifest.json "version"
          # (for example 1.0.0, not v1.0.0). For a v-prefixed tag push, the release is
          # created under the bare version tag on the same commit.
          VERSION="${TAG#v}"
          gh release create "$VERSION" main.js manifest.json styles.css             --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
